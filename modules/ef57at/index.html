<section class="modulex-ik modulex-ik--{{ikstil}}" id="ik-{{id}}" style="--ik-n:{{ikcount}}">
  <div class="modulex-ik__wrap">
    {{ikhead}}
    <ul class="modulex-ik__list" aria-label="{{groupLabel}}">{{ikcards}}</ul>
  </div>
</section>

<style>
  /* iletisim-kartlari — Hızlı iletişim kartları (31 Eki 2026, G8-C). Renkler yalnız desing anahtarı (token varsayılanlı). */
  .modulex-ik {
    box-sizing: border-box;
    width: 100%;
    padding-block: clamp(36px, 6vw, 72px);
    padding-inline: clamp(16px, 4vw, 32px);
    background: --bgcolor--;
    color: --textcolor--;
  }
  .modulex-ik *, .modulex-ik *::before, .modulex-ik *::after { box-sizing: border-box; }
  .modulex-ik__wrap { max-width: --max--; margin-inline: auto; }

  .modulex-ik__head { margin-block-end: 28px; text-align: center; }
  .modulex-ik__h2 { margin: 0 0 8px; font-size: clamp(1.6rem, 1.2rem + 1.5vw, 2.3rem); line-height: 1.2; color: --textcolor--; }
  .modulex-ik__desc { margin: 0 auto; max-width: 60ch; color: --mutedcolor--; line-height: 1.7; }

  .modulex-ik__list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--ik-n, 4), minmax(0, 1fr)); gap: 20px; }

  /* === kartli (varsayılan): dikey kart, ikon dairesi üstte, düğme altta === */
  .modulex-ik__card {
    position: relative; display: flex; flex-direction: column; gap: 14px; min-width: 0;
    padding: 26px 22px 22px;
    background: --surface--; border: 1px solid --bordercolor--; border-radius: --radius--;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .modulex-ik__card:hover,
  .modulex-ik__card:focus-within { transform: translateY(-6px); box-shadow: 0 22px 40px -26px rgba(0, 0, 0, 0.45); border-color: color-mix(in srgb, --accent-- 45%, transparent); }
  .modulex-ik__icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 56px; height: 56px; border-radius: 16px;
    background: color-mix(in srgb, --accent-- 14%, transparent); color: --accent--;
    transition: background-color 0.25s ease, color 0.25s ease, transform 0.25s ease;
  }
  .modulex-ik__icon .material-symbols-outlined { font-size: 28px; }
  .modulex-ik__card:hover .modulex-ik__icon { background: --accent--; color: --accentText--; transform: rotate(-6deg) scale(1.05); }
  .modulex-ik__body { display: flex; flex-direction: column; gap: 4px; flex: 1 1 auto; min-width: 0; }
  .modulex-ik__title { margin: 0; font-size: 1.1rem; line-height: 1.3; color: --textcolor--; }
  .modulex-ik__value { margin: 0; font-weight: 600; font-size: 1rem; color: --textcolor--; overflow-wrap: anywhere; text-align: start; }
  .modulex-ik__text { margin: 0; font-size: 0.9rem; line-height: 1.55; color: --mutedcolor--; }

  .modulex-ik a.modulex-ik__btn:link,
  .modulex-ik a.modulex-ik__btn:visited {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 46px; padding-inline: 18px; border-radius: 999px;
    background: --accent--; color: --accentText--;
    font-weight: 600; font-size: 0.95rem; text-decoration: none; cursor: pointer;
    transition: filter 0.2s ease, gap 0.2s ease;
  }
  .modulex-ik a.modulex-ik__btn:hover,
  .modulex-ik a.modulex-ik__btn:focus-visible { filter: brightness(1.08); gap: 12px; color: --accentText--; }
  .modulex-ik a.modulex-ik__btn:focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-ik__arrow { font-size: 18px; }
  [dir="rtl"] .modulex-ik__arrow { transform: scaleX(-1); }

  /* === ikon-serit: tek yatay şerit, dikey ayıraçlar, tüm öğe bağlantı gibi === */
  .modulex-ik--ikon-serit .modulex-ik__list { gap: 0; background: --surface--; border: 1px solid --bordercolor--; border-radius: --radius--; overflow: hidden; }
  .modulex-ik--ikon-serit .modulex-ik__card {
    flex-direction: row; align-items: center; gap: 16px; padding: 22px 24px;
    background: transparent; border: 0; border-radius: 0; border-inline-end: 1px solid --bordercolor--;
  }
  .modulex-ik--ikon-serit .modulex-ik__card:last-child { border-inline-end: 0; }
  .modulex-ik--ikon-serit .modulex-ik__card:hover,
  .modulex-ik--ikon-serit .modulex-ik__card:focus-within { transform: none; box-shadow: none; background: color-mix(in srgb, --accent-- 8%, transparent); }
  .modulex-ik--ikon-serit .modulex-ik__icon { width: 48px; height: 48px; border-radius: 999px; flex: 0 0 auto; }
  .modulex-ik--ikon-serit .modulex-ik__text { display: none; }
  .modulex-ik--ikon-serit .modulex-ik__title { font-size: 0.85rem; letter-spacing: 0.04em; text-transform: uppercase; color: --mutedcolor--; }
  .modulex-ik--ikon-serit .modulex-ik__value { font-size: 1.05rem; }
  .modulex-ik--ikon-serit a.modulex-ik__btn:link,
  .modulex-ik--ikon-serit a.modulex-ik__btn:visited { position: absolute; inset: 0; border-radius: 0; background: transparent; color: transparent; font-size: 0; padding: 0; min-height: 0; }
  .modulex-ik--ikon-serit a.modulex-ik__btn:hover { filter: none; }
  .modulex-ik--ikon-serit a.modulex-ik__btn:focus-visible { outline-offset: -3px; }
  .modulex-ik--ikon-serit .modulex-ik__arrow { display: none; }

  /* === dikey-liste: alt alta satırlar, ikon solda, düğme sağda === */
  .modulex-ik--dikey-liste .modulex-ik__list { grid-template-columns: minmax(0, 1fr); gap: 12px; max-width: 820px; margin-inline: auto; }
  .modulex-ik--dikey-liste .modulex-ik__head { text-align: start; max-width: 820px; margin-inline: auto; }
  .modulex-ik--dikey-liste .modulex-ik__desc { margin: 0; }
  .modulex-ik--dikey-liste .modulex-ik__card { flex-direction: row; align-items: center; gap: 18px; padding: 18px 20px; border-radius: calc(--radius-- * 0.7); border-inline-start: 4px solid --accent--; }
  .modulex-ik--dikey-liste .modulex-ik__card:hover,
  .modulex-ik--dikey-liste .modulex-ik__card:focus-within { transform: translateX(6px); }
  [dir="rtl"] .modulex-ik--dikey-liste .modulex-ik__card:hover,
  [dir="rtl"] .modulex-ik--dikey-liste .modulex-ik__card:focus-within { transform: translateX(-6px); }
  .modulex-ik--dikey-liste .modulex-ik__icon { width: 50px; height: 50px; border-radius: 999px; flex: 0 0 auto; }
  .modulex-ik--dikey-liste .modulex-ik__body { flex-direction: row; flex-wrap: wrap; align-items: baseline; column-gap: 12px; }
  .modulex-ik--dikey-liste .modulex-ik__title { font-size: 1rem; }
  .modulex-ik--dikey-liste .modulex-ik__text { flex-basis: 100%; }
  .modulex-ik--dikey-liste a.modulex-ik__btn:link,
  .modulex-ik--dikey-liste a.modulex-ik__btn:visited { flex: 0 0 auto; background: transparent; color: --accent--; border: 2px solid --accent--; }
  .modulex-ik--dikey-liste a.modulex-ik__btn:hover,
  .modulex-ik--dikey-liste a.modulex-ik__btn:focus-visible { background: --accent--; color: --accentText--; filter: none; }

  /* giriş animasyonu: yalnız JS işaretlediğinde gizle */
  .modulex-ik[data-ik-anim] .modulex-ik__card { opacity: 0; transform: translateY(14px); transition: opacity 0.3s ease, transform 0.3s ease; transition-delay: calc(var(--ik-i, 0) * 0.06s); }
  .modulex-ik.is-in .modulex-ik__card { opacity: 1; transform: none; transition-delay: calc(var(--ik-i, 0) * 0.06s), calc(var(--ik-i, 0) * 0.06s); }
  .modulex-ik.is-in .modulex-ik__card:hover { transition-delay: 0s; }

  @media (max-width: 1024px) {
    .modulex-ik__list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .modulex-ik--ikon-serit .modulex-ik__card:nth-child(2n) { border-inline-end: 0; }
    .modulex-ik--ikon-serit .modulex-ik__card:nth-child(-n + 2) { border-block-end: 1px solid --bordercolor--; }
  }
  @media (max-width: 768px) {
    .modulex-ik__list { grid-template-columns: minmax(0, 1fr); }
    .modulex-ik--ikon-serit .modulex-ik__card { border-inline-end: 0; border-block-end: 1px solid --bordercolor--; }
    .modulex-ik--ikon-serit .modulex-ik__card:last-child { border-block-end: 0; }
    .modulex-ik--dikey-liste .modulex-ik__card { flex-wrap: wrap; }
    .modulex-ik--dikey-liste a.modulex-ik__btn:link,
    .modulex-ik--dikey-liste a.modulex-ik__btn:visited { flex-basis: 100%; }
    .modulex-ik--dikey-liste .modulex-ik__card:hover { transform: none; }
    [class*="modulex"] { max-width: 100%; box-sizing: border-box; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ik *, .modulex-ik *::before, .modulex-ik *::after { animation: none !important; transition: none !important; }
    .modulex-ik[data-ik-anim] .modulex-ik__card { opacity: 1; transform: none; }
    .modulex-ik__card:hover { transform: none; }
  }
</style>

<script>
  (function () {
    var kok = document.getElementById("ik-{{id}}");
    if (!kok || kok.getAttribute("data-ik-hazir") === "1") { return; }
    kok.setAttribute("data-ik-hazir", "1");
    if (window.IntersectionObserver && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      kok.setAttribute("data-ik-anim", "1");
      var io = new IntersectionObserver(function (g) {
        for (var i = 0; i < g.length; i++) { if (g[i].isIntersecting) { kok.classList.add("is-in"); io.disconnect(); } }
      }, { threshold: 0.1 });
      io.observe(kok);
    }
  })();
</script>
