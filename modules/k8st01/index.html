<section class="modulex-stats" data-stil="--stil--">
  <div class="modulex-stats-container">
    {{html}}
  </div>
</section>

<style>
  .modulex-stats {
    width: 100%;
    padding: 56px 20px;
    background: --gradient--;
    box-sizing: border-box;
  }

  .modulex-stats-container {
    max-width: --max--;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 24px;
    text-align: center;
  }

  .modulex-stats-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    animation: statsIn 0.5s ease both;
  }

  @keyframes statsIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modulex-stats-icon {
    width: --iconbox--;
    height: --iconbox--;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
    color: --numbercolor--;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
  }

  .modulex-stats-icon .material-symbols-outlined {
    font-size: --iconsize--;
    line-height: 1;
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 48;
  }

  .modulex-stats-number {
    font-size: 40px;
    font-weight: 800;
    color: --numbercolor--;
    line-height: 1;
  }

  .modulex-stats-suffix {
    color: --numbercolor--;
  }

  .modulex-stats-label {
    font-size: 14px;
    font-weight: 500;
    color: --labelcolor--;
  }

  @media (max-width: 768px) {
    .modulex-stats {
      padding: 36px 14px;
    }

    .modulex-stats-container {
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .modulex-stats-number {
      font-size: 30px;
    }

    .modulex-stats-icon {
      width: calc(--iconbox-- * 0.85);
      height: calc(--iconbox-- * 0.85);
    }

    .modulex-stats-icon .material-symbols-outlined {
      font-size: calc(--iconsize-- * 0.85);
    }

    [class*="modulex"] {
      max-width: 100%;
      box-sizing: border-box;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    [class*="modulex"],
    [class*="modulex"] * {
      animation: none !important;
      transition: none !important;
    }
  }

  /* ---- G8-D varyantlar (31 Eki 2026): desing.stil → kök data-stil. "" = klasik (--gradient-- bant, --numbercolor--/--labelcolor--).
     Varyant renkleri yalnız var(--mx-site-*) token çiftleri: kartli = surface/text, serit-renkli = primary/primary-contrast. ---- */

  /* kartli — sayfa zemininde yüzey kartları, üst kenarda vurgu çizgisi, hover'da yükselir */
  [data-stil="kartli"] {
    background: var(--mx-site-bg, #fff);
    padding: 48px 20px;
  }

  [data-stil="kartli"] .modulex-stats-container {
    gap: 20px;
  }

  [data-stil="kartli"] .modulex-stats-item {
    padding: 28px 20px 26px;
    border-radius: var(--mx-radius-lg, 18px);
    border: 1px solid color-mix(in srgb, var(--mx-site-text, #1b1b1b) 10%, transparent);
    border-top: 4px solid var(--mx-site-primary, #2563eb);
    background-color: var(--mx-site-surface, #fff);
    color: var(--mx-site-text, #1b1b1b);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  [data-stil="kartli"] .modulex-stats-item:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 34px rgba(0, 0, 0, 0.1);
  }

  [data-stil="kartli"] .modulex-stats-icon {
    width: 64px;
    height: 64px;
    background-color: color-mix(in srgb, var(--mx-site-primary, #2563eb) 12%, transparent);
    color: var(--mx-site-primary, #2563eb);
  }

  [data-stil="kartli"] .modulex-stats-icon .material-symbols-outlined {
    font-size: 32px;
  }

  [data-stil="kartli"] .modulex-stats-number,
  [data-stil="kartli"] .modulex-stats-suffix {
    color: var(--mx-site-text, #1b1b1b);
  }

  [data-stil="kartli"] .modulex-stats-suffix {
    color: var(--mx-site-primary, #2563eb);
  }

  [data-stil="kartli"] .modulex-stats-label {
    color: color-mix(in srgb, var(--mx-site-text, #1b1b1b) 72%, transparent);
  }

  /* serit-renkli — tek renk marka şeridi (primary / primary-contrast), ikon solda, rakam+etiket yanında, ince dikey ayraçlar */
  [data-stil="serit-renkli"] {
    background: var(--mx-site-primary, #1e3046);
    color: var(--mx-site-primary-contrast, #fff);
    padding: 44px 20px;
  }

  [data-stil="serit-renkli"] .modulex-stats-container {
    gap: 0;
    text-align: start;
  }

  [data-stil="serit-renkli"] .modulex-stats-item {
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-rows: auto auto;
    column-gap: 14px;
    row-gap: 2px;
    align-items: center;
    justify-content: start;
    padding: 8px 24px;
    border-inline-start: 1px solid color-mix(in srgb, var(--mx-site-primary-contrast, #fff) 28%, transparent);
  }

  [data-stil="serit-renkli"] .modulex-stats-item:first-child {
    border-inline-start: 0;
  }

  [data-stil="serit-renkli"] .modulex-stats-icon {
    grid-column: 1;
    grid-row: 1 / span 2;
    width: 60px;
    height: 60px;
    margin: 0;
    background-color: color-mix(in srgb, var(--mx-site-primary-contrast, #fff) 16%, transparent);
    color: var(--mx-site-primary-contrast, #fff);
  }

  [data-stil="serit-renkli"] .modulex-stats-icon .material-symbols-outlined {
    font-size: 30px;
  }

  [data-stil="serit-renkli"] .modulex-stats-number {
    grid-column: 2;
    grid-row: 1;
    font-size: 36px;
    color: var(--mx-site-primary-contrast, #fff);
  }

  [data-stil="serit-renkli"] .modulex-stats-suffix {
    color: var(--mx-site-primary-contrast, #fff);
    opacity: 0.85;
  }

  [data-stil="serit-renkli"] .modulex-stats-label {
    grid-column: 2;
    grid-row: 2;
    font-size: 14px;
    color: var(--mx-site-primary-contrast, #fff);
    opacity: 0.88;
  }

  @media (max-width: 768px) {
    [data-stil="kartli"] {
      padding: 32px 14px;
    }

    [data-stil="kartli"] .modulex-stats-item {
      padding: 20px 14px 18px;
    }

    [data-stil="serit-renkli"] .modulex-stats-container {
      gap: 16px 0;
    }

    [data-stil="serit-renkli"] .modulex-stats-item {
      padding: 4px 14px;
    }

    [data-stil="serit-renkli"] .modulex-stats-item:nth-child(odd) {
      border-inline-start: 0;
    }

    [data-stil="serit-renkli"] .modulex-stats-icon {
      width: 48px;
      height: 48px;
    }

    [data-stil="serit-renkli"] .modulex-stats-number {
      font-size: 28px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    [data-stil="kartli"] .modulex-stats-item:hover {
      transform: none;
    }
  }
</style>

<script>
  /* Sayac animasyonu: gorunur oldugunda 0'dan hedefe sayar.
     prefers-reduced-motion'da animasyonsuz dogrudan hedef yazilir. */
  setTimeout(function () {
    var reduced = false;
    try {
      reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    } catch (e) {}
    var numbers = document.querySelectorAll(".modulex-stats-number[data-mx-count]");
    if (numbers.length === 0) {
      return;
    }

    function animateCount(el) {
      var target = parseInt(el.getAttribute("data-mx-count"), 10) || 0;
      if (reduced || !("IntersectionObserver" in window)) {
        el.firstChild.textContent = String(target);
        return;
      }
      var duration = 1200;
      var start = null;
      function step(ts) {
        if (start === null) {
          start = ts;
        }
        var progress = Math.min(1, (ts - start) / duration);
        /* easeOutCubic */
        var eased = 1 - Math.pow(1 - progress, 3);
        el.firstChild.textContent = String(Math.round(target * eased));
        if (progress < 1) {
          window.requestAnimationFrame(step);
        }
      }
      window.requestAnimationFrame(step);
    }

    if (!("IntersectionObserver" in window) || reduced) {
      for (var ni = 0; ni < numbers.length; ni++) {
        animateCount(numbers[ni]);
      }
      return;
    }
    var observer = new IntersectionObserver(function (entries) {
      for (var ei = 0; ei < entries.length; ei++) {
        if (entries[ei].isIntersecting) {
          animateCount(entries[ei].target);
          observer.unobserve(entries[ei].target);
        }
      }
    }, { threshold: 0.4 });
    for (var oi = 0; oi < numbers.length; oi++) {
      observer.observe(numbers[oi]);
    }
  }, 80);
</script>
