<section class="modulex-hero2">
  <div class="modulex-hero2-glow modulex-hero2-glow-a"></div>
  <div class="modulex-hero2-glow modulex-hero2-glow-b"></div>
  <div class="modulex-hero2-container">
    <div class="modulex-hero2-badge">{{badge}}</div>
    <h1 class="modulex-hero2-title">{{title}}</h1>
    <p class="modulex-hero2-desc">{{description}}</p>
    <div class="modulex-hero2-actions">
      <a href="{{btn1Url}}" class="modulex-hero2-btn modulex-hero2-btn-primary">
        <span>{{btn1Text}}</span>
        <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
      </a>
      <a href="{{btn2Url}}" class="modulex-hero2-btn modulex-hero2-btn-secondary">
        <span>{{btn2Text}}</span>
      </a>
    </div>
  </div>
</section>

<style>
  .modulex-hero2 {
    position: relative;
    width: 100%;
    min-height: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: --gradient--;
    overflow: hidden;
    box-sizing: border-box;
  }

  .modulex-hero2-glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.45;
  }

  .modulex-hero2-glow-a {
    width: 380px;
    height: 380px;
    background: --glow1--;
    top: -120px;
    left: -80px;
  }

  .modulex-hero2-glow-b {
    width: 320px;
    height: 320px;
    background: --glow2--;
    bottom: -100px;
    right: -60px;
  }

  /* AN5: süs amaçlı sonsuz "hero2Float" döngüsü kaldırıldı — ışıklar durağan */

  .modulex-hero2-container {
    position: relative;
    z-index: 2;
    max-width: --max--;
    margin: 0 auto;
    padding: 80px 20px;
    text-align: center;
    animation: hero2In 0.7s ease both;
  }

  @keyframes hero2In {
    from { opacity: 0; transform: translateY(22px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modulex-hero2-badge {
    display: inline-flex;
    align-items: center;
    padding: 8px 22px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(10px);
    border-radius: 50px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 22px;
  }

  .modulex-hero2-title {
    font-size: 54px;
    font-weight: 800;
    line-height: 1.12;
    color: #fff;
    letter-spacing: -1px;
    margin: 0 auto 18px;
    max-width: 820px;
  }

  .modulex-hero2-desc {
    font-size: 18px;
    line-height: 1.7;
    color: rgba(255, 255, 255, 0.85);
    margin: 0 auto 34px;
    max-width: 640px;
  }

  .modulex-hero2-actions {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .modulex-hero2-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 50px;
    padding: 14px 30px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
    box-sizing: border-box;
  }

  .modulex-hero2-btn-primary {
    background: --btnbg--;
    color: --btncolor--;
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.2);
  }

  .modulex-hero2-btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
  }

  .modulex-hero2-btn-secondary {
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    border: 1.5px solid rgba(255, 255, 255, 0.35);
  }

  .modulex-hero2-btn-secondary:hover {
    background: rgba(255, 255, 255, 0.22);
    transform: translateY(-3px);
  }

  @media (max-width: 768px) {
    .modulex-hero2 {
      min-height: 420px;
    }

    .modulex-hero2-container {
      padding: 56px 16px;
    }

    .modulex-hero2-title {
      font-size: 32px;
    }

    .modulex-hero2-desc {
      font-size: 15px;
    }

    .modulex-hero2-actions {
      flex-direction: column;
    }

    .modulex-hero2-btn {
      width: 100%;
    }

    [class*="modulex"] {
      max-width: 100%;
      box-sizing: border-box;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    [class*="modulex"],
    [class*="modulex"] * {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
