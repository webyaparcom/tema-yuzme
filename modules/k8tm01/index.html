<section class="modulex-team">
  <div class="modulex-team-container">
    <div class="modulex-team-header">
      <div class="modulex-team-badge">{{badge}}</div>
      <h2 class="modulex-team-title">{{title}}</h2>
      <p class="modulex-team-desc">{{description}}</p>
    </div>
    <div class="modulex-team-grid">
      {{html}}
    </div>
  </div>
</section>

<style>
  .modulex-team {
    width: 100%;
    padding: 80px 20px;
    background: --bgcolor--;
    box-sizing: border-box;
  }

  .modulex-team-container {
    max-width: --max--;
    margin: 0 auto;
  }

  .modulex-team-header {
    text-align: center;
    margin-bottom: 48px;
  }

  .modulex-team-badge {
    display: inline-block;
    padding: 6px 18px;
    background: --accent--;
    color: --accentText--; /* 31 Eki: sabit beyaz → token */
    border-radius: 50px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .modulex-team-title {
    font-size: 36px;
    font-weight: 800;
    color: --titlecolor--;
    margin: 0 0 12px;
  }

  .modulex-team-desc {
    font-size: 16px;
    color: --textcolor--;
    max-width: 640px;
    margin: 0 auto;
    line-height: 1.7;
  }

  .modulex-team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 24px;
  }

  .modulex-team-card {
    background: --cardbg--;
    border: 1px solid --bordercolor--;
    border-radius: 16px;
    padding: 28px 20px;
    text-align: center;
    box-sizing: border-box;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    animation: modulexTeamIn 0.5s ease both;
  }

  .modulex-team-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.1);
  }

  .modulex-team-avatar {
    width: 108px;
    height: 108px;
    margin: 0 auto 16px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid --accent--;
    background: --bordercolor--;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modulex-team-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .modulex-team-avatar .material-symbols-outlined {
    font-size: 52px;
    color: --textcolor--;
  }

  .modulex-team-name {
    font-size: 17px;
    font-weight: 700;
    color: --titlecolor--;
    margin: 0 0 4px;
  }

  .modulex-team-role {
    font-size: 13px;
    font-weight: 600;
    color: --accent--;
    margin: 0 0 10px;
  }

  .modulex-team-bio {
    font-size: 13px;
    line-height: 1.6;
    color: --textcolor--;
    margin: 0;
  }

  @keyframes modulexTeamIn {
    from {
      opacity: 0;
      transform: translateY(16px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 768px) {
    .modulex-team {
      padding: 48px 14px;
    }

    .modulex-team-title {
      font-size: 26px;
    }

    .modulex-team-grid {
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }

    [class*="modulex"] {
      max-width: 100%;
      box-sizing: border-box;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    [class*="modulex"],
    [class*="modulex"] * {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
